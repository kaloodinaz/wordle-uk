<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <link rel="manifest" href="https://kaloodinaz.github.io/manifest.json">
  <link rel="shortcut icon" href="https://kaloodinaz.github.io/favicon.ico">
  <title>Wordle UK - Play Online</title>
  <meta name="description" content="Play Wordle UK online. Guess the hidden five-letter word in six attempts.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}
(function(){try{var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
</script>
  <iframe
    src="https://wordlegame.uk/"
    title="Wordle UK Game"
    allow="fullscreen"
    allowfullscreen
    loading="eager">
  </iframe>

</body>
</html>
